<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowBg" cx="30%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#161033"/>
      <stop offset="55%" stop-color="#0A0A1C"/>
      <stop offset="100%" stop-color="#050509"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF2E92"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BFEFFF"/>
    </linearGradient>
    <filter id="strongGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hex" width="46" height="80" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M23 0 L46 13 L46 40 L23 53 L0 40 L0 13 Z" fill="none" stroke="#1B2440" stroke-width="1" opacity="0.5"/>
      <path d="M23 53 L46 66 L46 93 L23 106 L0 93 L0 66 Z" fill="none" stroke="#1B2440" stroke-width="1" opacity="0.5"/>
    </pattern>
    <mask id="fade">
      <rect width="900" height="240" fill="url(#fadeGrad)"/>
    </mask>
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="70%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="900" height="240" fill="url(#glowBg)"/>
  <rect width="900" height="240" fill="url(#hex)" mask="url(#fade)"/>

  <!-- scanline accents -->
  <line x1="0" y1="60" x2="900" y2="60" stroke="#00E5FF" stroke-width="0.4" opacity="0.10"/>
  <line x1="0" y1="180" x2="900" y2="180" stroke="#FF2E92" stroke-width="0.4" opacity="0.10"/>

  <!-- outer frame -->
  <rect x="18" y="18" width="864" height="204" fill="none" stroke="url(#edge)" stroke-width="1.2" opacity="0.5"/>
  <!-- HUD corner brackets -->
  <path d="M18 46 V18 H46" fill="none" stroke="#00E5FF" stroke-width="2.4"/>
  <path d="M882 194 V222 H854" fill="none" stroke="#FF2E92" stroke-width="2.4"/>
  <path d="M882 18 H854 M882 18 V46" fill="none" stroke="#8B5CF6" stroke-width="2.4"/>
  <path d="M18 222 H46 M18 222 V194" fill="none" stroke="#8B5CF6" stroke-width="2.4"/>

  <!-- status pill -->
  <circle cx="805" cy="40" r="4" fill="#00FFA3" filter="url(#strongGlow)"/>
  <text x="816" y="44" font-family="JetBrains Mono, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#7FE0C8">ONLINE</text>

  <!-- wordmark -->
  <text x="56" y="118" font-family="JetBrains Mono, Consolas, monospace" font-size="58" font-weight="800" fill="url(#textGlow)" filter="url(#strongGlow)">KAUSHAL <tspan fill="#00E5FF">S</tspan></text>

  <!-- underline accent -->
  <rect x="58" y="132" width="230" height="3" fill="url(#edge)"/>

  <text x="58" y="160" font-family="JetBrains Mono, Consolas, monospace" font-size="18" letter-spacing="3.5" fill="#A7B3D6">AI SYSTEMS <tspan fill="#FF2E92">×</tspan> SECURITY <tspan fill="#FF2E92">×</tspan> EDGE</text>

  <text x="58" y="196" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#4E5A78">root@amrita:~$ <tspan fill="#00E5FF">systemctl status kaushal --live</tspan></text>
</svg>
