<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">Featured: Satellite Optical Fault Recovery</title><desc id="desc">Featured project KR-100. Active fault diagnosis and verified recovery for satellite laser links, MATLAB and Simulink, 320 matched trials. Detection accuracy 72.1% to 96.5%, exact fault isolation 9.5% to 71.5%, false-alarm rate 33.4% to 3.0%. Reproduced 320 of 320 trials exactly.</desc><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#eaf2ff}.m{fill:#a9c4ea}.n{fill:#ffd54a}.a{fill:#7fe3ff}.k{letter-spacing:1.6px}</style><defs><pattern id="gmin" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" fill="none" stroke="#1f4f8f" stroke-width="0.6"/></pattern><pattern id="gmaj" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="url(#gmin)"/><path d="M60 0H0V60" fill="none" stroke="#3364a6" stroke-width="0.9"/></pattern></defs><rect width="900" height="320" fill="#0f3d7a"/><rect x="10" y="10" width="880" height="300" fill="url(#gmaj)"/><rect x="10" y="10" width="880" height="300" fill="none" stroke="#eaf2ff" stroke-width="1.4"/><rect x="16" y="16" width="868" height="288" fill="none" stroke="#eaf2ff" stroke-width="0.6" opacity="0.6"/><path d="M10 28V10H28" fill="none" stroke="#eaf2ff" stroke-width="2"/><path d="M890 28V10H872" fill="none" stroke="#eaf2ff" stroke-width="2"/><path d="M10 292V310H28" fill="none" stroke="#eaf2ff" stroke-width="2"/><path d="M890 292V310H872" fill="none" stroke="#eaf2ff" stroke-width="2"/><text x="34" y="44" font-size="10" class="k m">DWG KR-100 · FEATURED PROJECT</text><rect x="716.8" y="30" width="149.20000000000002" height="20" fill="#ffd54a"/><text x="858" y="44" text-anchor="end" font-size="10" font-weight="700" class="k" style="fill:#0f3d7a">LATEST · LIVE SITE</text><text x="34" y="82" font-size="26" font-weight="700">SATELLITE OPTICAL FAULT RECOVERY</text><text x="34" y="106" font-size="11.5" class="a">WHEN A LASER LINK BETWEEN SATELLITES FAILS, WHAT BROKE, AND CAN IT BE FIXED?</text><text x="34" y="126" font-size="10" class="m">MATLAB R2026a · Simulink · 4–10 satellites · 320 matched trials</text><text x="34" y="152" font-size="8" class="k m">METRIC</text><rect x="210" y="145" width="14" height="6" fill="#a9c4ea" opacity="0.6"/><text x="230" y="152" font-size="8" class="k m">V1 ORIGINAL</text><rect x="334" y="145" width="14" height="6" fill="#ffd54a"/><text x="354" y="152" font-size="8" class="k m">V2 REVISED</text><text x="34" y="170" font-size="9" class="k">DETECTION ACCURACY</text><rect x="210" y="160" width="300" height="6" fill="none" stroke="#eaf2ff" stroke-width="0.6"/><rect x="210" y="160" width="216.3" height="6" fill="#a9c4ea" opacity="0.6"/><rect x="210" y="168" width="289.5" height="6" fill="#ffd54a"/><text x="210" y="187" font-size="10" class="m">72.1%</text><text x="510" y="187" font-size="11" font-weight="700" text-anchor="end" class="n">96.5% ↑</text><text x="34" y="204" font-size="9" class="k">EXACT FAULT ISOLATION</text><rect x="210" y="194" width="300" height="6" fill="none" stroke="#eaf2ff" stroke-width="0.6"/><rect x="210" y="194" width="28.5" height="6" fill="#a9c4ea" opacity="0.6"/><rect x="210" y="202" width="214.5" height="6" fill="#ffd54a"/><text x="210" y="221" font-size="10" class="m">9.5%</text><text x="510" y="221" font-size="11" font-weight="700" text-anchor="end" class="n">71.5% ↑</text><text x="34" y="238" font-size="9" class="k">FALSE-ALARM RATE</text><rect x="210" y="228" width="300" height="6" fill="none" stroke="#eaf2ff" stroke-width="0.6"/><rect x="210" y="228" width="100.2" height="6" fill="#a9c4ea" opacity="0.6"/><rect x="210" y="236" width="9.0" height="6" fill="#ffd54a"/><text x="210" y="255" font-size="10" class="m">33.4%</text><text x="510" y="255" font-size="11" font-weight="700" text-anchor="end" class="n">3.0% ↓</text><circle cx="700" cy=