name: Refresh profile

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'README.template.md'
      - 'kaushal_api/**'
      - 'assets/banner*.svg'
      - 'tests/**'
      - 'test_pipeline.py'
      - '.github/workflows/telemetry.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test generator
        run: python -m unittest discover -v
      - name: Refresh public GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m kaushal_api.build
      - name: Commit refreshed profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/status.json assets/stats*.svg assets/languages*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile data [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
