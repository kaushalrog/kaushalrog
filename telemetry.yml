name: telemetry

on:
  schedule:
    # Every 6 hours. GitHub queues scheduled runs on busy infra, so treat the
    # timing as approximate — it will drift by several minutes.
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect telemetry and render README
        env:
          # PROFILE_TOKEN is a classic PAT with `read:user` — it unlocks the
          # contribution and streak numbers. Without it the run still succeeds
          # and those two lines are simply omitted.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python -m kaushal_api.build

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/status.json
          if git diff --staged --quiet; then
            echo "no telemetry change"
          else
            git commit -m "chore(telemetry): refresh status panels [skip ci]"
            git push
          fi
